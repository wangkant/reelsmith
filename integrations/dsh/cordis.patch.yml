# dsh-plugin-reelsmith: DeepSeek Harness as a video editor.
#
# The `reelsmith` row is the service (settings, reelsmith's MCP servers, the panel routes) and, being the bare
# package name, carries the browser half (Video editor panel, reelsmith tool rows, settings page). Agents get
# the tools from `dsh-plugin-reelsmith/tools`: in Web through the Video editor preset, in single-agent
# profiles (headless, SDK) as a process-wide row, mirroring how the base bundle moves the agent plane
# behind presets only when dsh-web-app is in the profile.

- insert:
    - id: reelsmith
      name: dsh-plugin-reelsmith

    # Single-agent profiles: the one agent gets reelsmith's tools, prompt section and skill.
    - id: reelsmith-tools
      name: dsh-plugin-reelsmith/tools
      disabled: !!js "ctx.get('profileContext')?.startedBundles?.includes('@deepseek-ai/dsh-web-app') === true"

    - id: reelsmith-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: !!js "ctx.get('profileContext')?.startedBundles?.includes('@deepseek-ai/dsh-web-app') === true"
      inject: [reelsmith]
      config:
        providerName: reelsmith
        includeDefaultRoots: false
        customSkillDirs: !!js "ctx.get('reelsmith')?.skillDirs?.() ?? []"

    # Web: a Video editor preset, selectable per session (Settings > General makes it the default).
    - id: preset-video-editor
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: !!js "ctx.get('profileContext')?.startedBundles?.includes('@deepseek-ai/dsh-web-app') !== true"
      config:
        id: video-editor
        name: Video editor
        description: Make and edit films with reelsmith, a video editor the agent drives with tools and code.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a video editor powered by the {{model}} model, working in DeepSeek Harness with reelsmith.
          - id: reelsmith-tools
            name: dsh-plugin-reelsmith/tools
          - id: reelsmith-skill
            name: '@deepseek-ai/dsh-skill-filesystem'
            inject: [reelsmith]
            config:
              providerName: reelsmith
              includeDefaultRoots: false
              customSkillDirs: !!js "ctx.get('reelsmith')?.skillDirs?.() ?? []"
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
