[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelsmith"
version = "0.1.0"
description = "A video editor built for AI agents: script, voice, assets and an NLE timeline in, a checked vertical film out"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Qiankang Wang" }]
dependencies = ["pydantic>=2.7", "mcp>=2.3,<3", "jsonschema>=4.20", "pillow>=11"]

[project.urls]
Repository = "https://github.com/wangkant/reelsmith"

[project.optional-dependencies]
capture = ["playwright>=1.45"]
runner = ["claude-agent-sdk>=0.2.170"]
web = ["ddgs>=9"]
dev = ["pytest>=8"]

[project.scripts]
reelsmith = "reelsmith.cli:main"
reelsmith-mcp = "reelsmith.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["reelsmith"]
