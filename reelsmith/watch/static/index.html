<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>reelsmith watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23202329'/%3E%3Crect x='3' y='4' width='6' height='3' rx='1' fill='%236ea8ff'/%3E%3Crect x='6' y='9' width='7' height='3' rx='1' fill='%238a93a3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4c0 .5.5.8.9.5l8-5.2a.6.6 0 0 0 0-1L5.4 2.3c-.4-.3-.9 0-.9.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" rx=".8" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx=".8" fill="currentColor"/></symbol>
  <symbol id="i-start" viewBox="0 0 16 16"><rect x="2.5" y="3" width="1.8" height="10" rx=".6" fill="currentColor"/><path d="M13 3.6v8.8c0 .5-.5.7-.9.5L5.6 8.5a.6.6 0 0 1 0-1l6.5-4.4c.4-.3.9 0 .9.5z" fill="currentColor"/></symbol>
  <symbol id="i-end" viewBox="0 0 16 16"><rect x="11.7" y="3" width="1.8" height="10" rx=".6" fill="currentColor"/><path d="M3 3.6v8.8c0 .5.5.7.9.5l6.5-4.4a.6.6 0 0 0 0-1L3.9 3.1c-.4-.3-.9 0-.9.5z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-vol" viewBox="0 0 16 16"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z" fill="currentColor"/><path class="wave" d="M10.4 5.4a3.6 3.6 0 0 1 0 5.2M12.3 3.6a6.2 6.2 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="cross" d="m10.5 6 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-safe" viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="4" y="5.3" width="8" height="5.4" rx=".6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.6 1.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-fit" viewBox="0 0 16 16"><path d="M2.5 5.5V3h2.5M13.5 5.5V3H11M2.5 10.5V13h2.5M13.5 10.5V13H11M5.5 8h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-follow" viewBox="0 0 16 16"><path d="M8 1.8v12.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.2 1.8h5.6L8 4.6z" fill="currentColor"/><path d="M11 9.5 13.5 12 11 14.5M5 9.5 2.5 12 5 14.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-replay" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.6 2.4v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.8 5.8v4.4L10.4 8z" fill="currentColor"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="brand" aria-hidden="true"><span class="brand-mark"></span></div>
    <div class="top-title">
      <h1 id="filmTitle">&nbsp;</h1>
      <span id="projName" class="proj mono"></span>
    </div>
    <div class="top-facts">
      <span class="fact mono" id="canvasInfo"></span>
      <span class="fact"><span class="fact-k" data-i18n="top.length">Length</span> <span class="mono" id="lengthInfo">–</span></span>
      <span class="fact spend" id="spendBox" hidden>
        <span class="fact-k" data-i18n="top.spend">Spent</span>
        <span class="mono" id="spendText"></span>
        <span class="meter" id="spendBar"></span>
      </span>
      <span class="pill" id="delivery"></span>
      <span class="status" id="status" data-state="connecting" role="status" aria-live="polite">
        <span class="status-dot"></span><span id="statusText"></span>
      </span>
      <button class="icon-btn help-btn" id="helpBtn" type="button" data-i18n-title="help.title">?</button>
    </div>
  </header>

  <main class="work">
    <section class="monitor" aria-label="Monitor">
      <div class="screen" id="screen">
        <div class="film" id="film">
          <iframe id="player" title="Live player" hidden allow="autoplay"></iframe>
          <img id="still" alt="" hidden>
          <video id="delivered" hidden playsinline preload="metadata"></video>
          <div class="safe" id="safe" hidden></div>
          <div class="screen-msg" id="screenMsg" hidden></div>
        </div>
        <span class="source-tag" id="sourceTag"></span>
        <span class="stale-tag" id="staleTag" data-i18n="mon.staleDelivered" hidden></span>
      </div>
      <div class="transport">
        <div class="tr-group tr-left">
          <div class="seg" role="group">
            <button type="button" class="seg-btn" id="srcLive" aria-pressed="true" data-i18n="mon.live">live cut</button>
            <button type="button" class="seg-btn" id="srcDelivered" aria-pressed="false" data-i18n="tr.deliveredSwitch">Delivered film</button>
          </div>
        </div>
        <div class="tr-group tr-mid">
          <button class="icon-btn" id="startBtn" type="button" data-i18n-title="tr.start"><svg><use href="#i-start"/></svg></button>
          <button class="icon-btn" id="backBtn" type="button" data-i18n-title="tr.back"><svg><use href="#i-back"/></svg></button>
          <button class="icon-btn play" id="playBtn" type="button" aria-pressed="false"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
          <button class="icon-btn" id="fwdBtn" type="button" data-i18n-title="tr.fwd"><svg><use href="#i-fwd"/></svg></button>
          <button class="icon-btn" id="endBtn" type="button" data-i18n-title="tr.end"><svg><use href="#i-end"/></svg></button>
          <div class="tc">
            <span class="tc-main mono" id="tc">0:00.00</span>
            <span class="tc-sub mono"><span id="tcTotal">0:00.00</span> · <span id="tcFrame">frame 0</span></span>
          </div>
        </div>
        <div class="tr-group tr-right">
          <button class="icon-btn" id="safeBtn" type="button" aria-pressed="false" data-i18n-title="tr.safe"><svg><use href="#i-safe"/></svg></button>
          <button class="icon-btn mute" id="muteBtn" type="button" aria-pressed="false"><svg><use href="#i-vol"/></svg></button>
          <input class="range" id="volume" type="range" min="0" max="1" step="0.05" value="1" data-i18n-title="tr.volume">
        </div>
      </div>
    </section>

    <aside class="side" aria-label="Side panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-activity" aria-controls="pane-activity" type="button"><span data-i18n="tab.activity">Activity</span><kbd>1</kbd></button>
        <button role="tab" id="tab-issues" aria-controls="pane-issues" type="button"><span data-i18n="tab.issues">Issues</span><span class="tab-count" id="issueCount"></span><kbd>2</kbd></button>
        <button role="tab" id="tab-clip" aria-controls="pane-clip" type="button"><span data-i18n="tab.clip">Clip</span><kbd>3</kbd></button>
        <button role="tab" id="tab-assets" aria-controls="pane-assets" type="button"><span data-i18n="tab.assets">Assets</span><kbd>4</kbd></button>
      </div>
      <div class="pane pane-activity" id="pane-activity" role="tabpanel" aria-labelledby="tab-activity">
        <div class="replay" id="replay" hidden>
          <span class="replay-title" data-i18n="act.replay" data-i18n-title="act.replayHint">Replay</span>
          <button class="icon-btn sm" id="replayPrev" type="button" data-i18n-title="act.prev"><svg><use href="#i-back"/></svg></button>
          <input class="range" id="replayRange" type="range" min="0" max="1" step="1" value="1" data-i18n-title="act.replayHint">
          <button class="icon-btn sm" id="replayNext" type="button" data-i18n-title="act.next"><svg><use href="#i-fwd"/></svg></button>
          <button class="icon-btn sm" id="replayPlay" type="button" aria-pressed="false"><svg><use href="#i-replay"/></svg></button>
          <span class="replay-label mono" id="replayLabel"></span>
        </div>
        <div class="feed" id="feed" tabindex="0" aria-live="polite"></div>
      </div>
      <div class="pane" id="pane-issues" role="tabpanel" aria-labelledby="tab-issues" hidden><div class="scroll" id="issuesList"></div></div>
      <div class="pane" id="pane-clip" role="tabpanel" aria-labelledby="tab-clip" hidden><div class="scroll" id="clipBody"></div></div>
      <div class="pane" id="pane-assets" role="tabpanel" aria-labelledby="tab-assets" hidden><div class="scroll" id="assetsList"></div></div>
    </aside>
  </main>

  <div class="split" id="split" role="separator" aria-orientation="horizontal" tabindex="0"></div>

  <section class="timeline" aria-label="Timeline">
    <div class="tl-bar">
      <div class="tl-tools">
        <button class="icon-btn sm" id="zoomOut" type="button" data-i18n-title="tl.zoomOut"><svg><use href="#i-minus"/></svg></button>
        <span class="zoom-label mono" id="zoomLabel"></span>
        <button class="icon-btn sm" id="zoomIn" type="button" data-i18n-title="tl.zoomIn"><svg><use href="#i-plus"/></svg></button>
        <button class="text-btn" id="zoomFit" type="button"><svg><use href="#i-fit"/></svg><span data-i18n="tl.fit">Fit</span></button>
        <button class="text-btn toggle" id="followBtn" type="button" aria-pressed="true" data-i18n-title="tl.followHint"><svg><use href="#i-follow"/></svg><span data-i18n="tl.follow">Follow</span></button>
      </div>
      <div class="history-banner" id="historyBanner" hidden>
        <span class="hb-dot"></span>
        <span id="historyText"></span>
        <button class="text-btn accent" id="backToNow" type="button" data-i18n="tl.backToNow">Back to now</button>
      </div>
    </div>
    <div class="tl-body">
      <div class="tl-heads" id="tlHeads"></div>
      <div class="tl-main" id="tlMain">
        <canvas id="tlCanvas" tabindex="-1"></canvas>
        <div class="tl-empty" id="tlEmpty" hidden>
          <svg class="tl-empty-art" viewBox="0 0 120 56" aria-hidden="true">
            <rect x="4" y="6" width="44" height="12" rx="3"/><rect x="52" y="6" width="28" height="12" rx="3"/>
            <rect x="18" y="24" width="70" height="12" rx="3"/><rect x="4" y="42" width="112" height="10" rx="3"/>
          </svg>
          <strong data-i18n="tl.emptyTitle">No tracks yet</strong>
          <p data-i18n="tl.emptyBody"></p>
        </div>
        <div class="error-card" id="errorCard" hidden role="alert">
          <strong data-i18n="err.title">The project does not load</strong>
          <p class="error-text mono" id="errorText"></p>
          <p class="error-note" id="errorNote"></p>
        </div>
        <div class="tl-tip" id="tlTip" hidden></div>
      </div>
    </div>
    <div class="tl-hbar" id="tlHbar"><div class="tl-hthumb" id="tlHthumb"></div></div>
  </section>
</div>

<dialog class="help" id="help" aria-labelledby="helpTitle">
  <h2 id="helpTitle" data-i18n="help.title">Keyboard</h2>
  <dl class="keys">
    <dt><kbd>Space</kbd></dt><dd data-i18n="help.play"></dd>
    <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="help.frame"></dd>
    <dt><kbd>Shift</kbd> + <kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="help.second"></dd>
    <dt><kbd>Home</kbd> <kbd>End</kbd></dt><dd data-i18n="help.ends"></dd>
    <dt><kbd>+</kbd> <kbd>−</kbd> · <kbd>Ctrl</kbd> + wheel</dt><dd data-i18n="help.zoom"></dd>
    <dt><kbd>F</kbd></dt><dd data-i18n="help.fit"></dd>
    <dt><kbd>S</kbd></dt><dd data-i18n="help.safe"></dd>
    <dt><kbd>1</kbd>–<kbd>4</kbd></dt><dd data-i18n="help.tabs"></dd>
    <dt><kbd>?</kbd></dt><dd data-i18n="help.help"></dd>
  </dl>
  <button class="text-btn accent" id="helpClose" type="button" data-i18n="help.close">Close</button>
</dialog>
</body>
</html>
