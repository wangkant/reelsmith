<script>
  // The theme and language are settled before the first paint, so neither flashes.
  (function () {
    var d = document.documentElement, pick = "system";
    try { pick = JSON.parse(localStorage.getItem("rs-watch:theme")) || "system"; } catch (e) {}
    d.dataset.themePick = pick;
    d.dataset.theme = pick === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pick;
    try { var l = JSON.parse(localStorage.getItem("rs-watch:lang")); if (l) d.lang = l; } catch (e) {}
  })();
</script>

<div class="app">
  <header class="top">
    <span class="mark" aria-hidden="true"><i></i></span>
    <div class="crumb">
      <h1 id="filmTitle">&nbsp;</h1>
      <span class="facts" id="canvasInfo"></span>
    </div>
    <span class="grow"></span>
    <span class="conn" id="conn" data-state="connecting" role="status"><span class="dot"></span><span id="connText"></span></span>
    <span class="status" id="result" tabindex="0" role="status" aria-live="polite"><span class="dot"></span><b id="resultTitle"></b><span class="sep"></span><em id="resultSub"></em></span>
    <div class="menu-wrap">
      <button class="btn sm lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu"><svg><use href="#i-globe"/></svg><span class="lang-name" id="langName"></span><svg class="chev"><use href="#i-chev"/></svg></button>
      <div class="menu lang-menu" id="langMenu" role="menu" aria-labelledby="langBtn" hidden></div>
    </div>
    <div class="seg theme" role="group" id="themeSeg">
      <button type="button" data-pick="light"><svg><use href="#i-sun"/></svg></button>
      <button type="button" data-pick="dark"><svg><use href="#i-moon"/></svg></button>
      <button type="button" data-pick="system"><svg><use href="#i-monitor"/></svg></button>
    </div>
    <button class="btn primary" id="acceptBtn" type="button" hidden><svg><use href="#i-tick"/></svg><span data-i18n="top.accept">Accept the film</span><span class="spin" aria-hidden="true"></span></button>
  </header>

  <main class="work">
    <aside class="session side" id="session">
      <div class="session-head">
        <h2 data-i18n="session.title">Session</h2>
        <span class="agent" id="agent" role="status" aria-live="polite" data-state="off"><span class="agent-dot"></span><span class="agent-text" id="agentText"></span></span>
        <span class="grow"></span>
        <button class="chip on filter-chip" id="filterChip" type="button" hidden><span id="filterText"></span><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        <button class="icon-btn" id="replayBtn" type="button" aria-pressed="false" aria-controls="replay"><svg><use href="#i-history"/></svg></button>
        <div class="menu-wrap" id="moreWrap">
          <button class="icon-btn" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu"><svg><use href="#i-more"/></svg></button>
          <div class="menu more-menu" id="moreMenu" role="menu" aria-labelledby="moreBtn" hidden>
            <button class="menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-pane="issues" data-label="pane.issues"><svg aria-hidden="true"><use href="#i-warn"/></svg><span></span><span class="tab-count" id="issueCount"></span></button>
            <button class="menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-pane="clip" data-label="pane.clip"><svg aria-hidden="true"><use href="#i-target"/></svg><span></span></button>
            <button class="menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-pane="assets" data-label="pane.assets"><svg aria-hidden="true"><use href="#i-box"/></svg><span></span><span class="tab-count" id="assetCount"></span></button>
            <div class="menu-sep" role="separator"></div>
            <div class="filter-group" id="filterGroup" role="group" hidden>
              <div class="menu-title" data-i18n="filter.title"></div>
              <button class="menu-item" type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-filter="all" data-label="filter.all"><svg aria-hidden="true"><use href="#i-tick"/></svg><span></span></button>
              <button class="menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-filter="talk" data-label="filter.talk"><svg aria-hidden="true"><use href="#i-tick"/></svg><span></span></button>
              <button class="menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-filter="changes" data-label="filter.changes"><svg aria-hidden="true"><use href="#i-tick"/></svg><span></span></button>
              <button class="menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-filter="problems" data-label="filter.problems"><svg aria-hidden="true"><use href="#i-tick"/></svg><span></span></button>
              <div class="menu-sep" role="separator"></div>
            </div>
            <button class="menu-item" type="button" role="menuitem" tabindex="-1" data-do="help" data-label="help.btn"><svg aria-hidden="true"><use href="#i-help"/></svg><span></span><kbd>?</kbd></button>
          </div>
        </div>
      </div>
      <div class="replay" id="replay" hidden>
        <span class="replay-title" data-i18n="act.replay" data-i18n-title="act.replayHint">Replay</span>
        <button class="icon-btn sm" id="replayPrev" type="button" data-i18n-title="act.prev"><svg><use href="#i-back"/></svg></button>
        <input class="range" id="replayRange" type="range" min="0" max="1" step="1" value="1" data-i18n-title="act.replayHint">
        <button class="icon-btn sm" id="replayNext" type="button" data-i18n-title="act.next"><svg><use href="#i-fwd"/></svg></button>
        <button class="icon-btn sm" id="replayPlay" type="button" aria-pressed="false"><svg><use href="#i-replay"/></svg></button>
        <span class="replay-label num" id="replayLabel"></span>
      </div>
      <div class="pane-head" id="paneHead" hidden>
        <button class="text-btn" id="paneBack" type="button"><svg><use href="#i-back"/></svg><span data-i18n="session.title">Session</span></button>
        <strong id="paneTitle"></strong>
      </div>
      <section class="intro" id="intro" aria-labelledby="introTitle" hidden></section>
      <div class="pane pane-chat" id="pane-chat">
        <div class="chat-scroll">
          <div class="chat-log" id="chatLog" tabindex="0" role="log" aria-live="polite"></div>
          <button class="new-pill" id="chatNew" type="button" hidden><span id="chatNewText"></span><svg><use href="#i-chev"/></svg></button>
        </div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="c-card is-warn chat-block" id="chatBlock" role="status" hidden></div>
          <div class="compose-box" id="composeBox">
            <div class="ctx-row" id="ctxRow" hidden></div>
            <textarea id="chatInput" rows="1" spellcheck="true"></textarea>
            <div class="compose-actions">
              <button class="q-btn" id="qRender" type="button" data-action="render"><svg><use href="#i-clapper"/></svg><span data-i18n="q.render">Render the film</span><span class="spin" aria-hidden="true"></span></button>
              <button class="q-btn" id="qCheck" type="button" data-action="check"><svg><use href="#i-checks"/></svg><span data-i18n="q.check">Check the film</span><span class="spin" aria-hidden="true"></span></button>
              <button class="q-btn" id="qUndo" type="button" data-action="undo"><svg><use href="#i-undo"/></svg><span data-i18n="q.undo">Undo the last change</span><span class="spin" aria-hidden="true"></span></button>
              <span class="grow"></span>
              <button class="send-btn" id="sendBtn" type="submit"><svg class="i-send"><use href="#i-send"/></svg><svg class="i-stop"><use href="#i-stop"/></svg><span class="spin" aria-hidden="true"></span><span class="send-text" id="sendText"></span></button>
            </div>
          </div>
          <p class="compose-err" id="composeErr" role="alert" hidden></p>
          <div class="compose-foot">
            <span class="engine-wrap">
              <button class="engine-btn" id="engineBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="engineMenu"><span class="engine-dot"></span><span class="engine-text" id="engineText"></span><svg><use href="#i-chev"/></svg></button>
              <ul class="engine-menu" id="engineMenu" role="listbox" tabindex="-1" hidden></ul>
            </span>
            <span class="compose-hint" id="composeHint"></span>
            <span class="chat-spend" id="chatSpend" hidden><span class="num" id="chatSpendText"></span><span class="meter" id="chatSpendBar"></span></span>
          </div>
        </form>
      </div>
      <div class="pane" id="pane-issues" hidden><div class="scroll" id="issuesList"></div></div>
      <div class="pane" id="pane-clip" hidden><div class="scroll" id="clipBody"></div></div>
      <div class="pane" id="pane-assets" hidden><div class="scroll" id="assetsList"></div></div>
    </aside>

    <div class="col-split" id="colSplit" role="separator" aria-orientation="vertical" aria-controls="session" tabindex="0"></div>

    <section class="stage-area" id="stageArea">
      <div class="player" id="playerBox">
        <div class="screen" id="screen">
          <div class="film" id="film">
            <iframe id="player" title="Live player" hidden allow="autoplay" tabindex="-1"></iframe>
            <img id="still" alt="" hidden>
            <video id="delivered" hidden playsinline preload="metadata"></video>
            <div class="safe" id="safe" hidden></div>
            <div class="sel-box" id="selBox" hidden><span class="sel-tag" id="selTag"></span><i></i><i></i><i></i><i></i></div>
            <div class="pop-glyph" id="popGlyph" aria-hidden="true"><svg><use href="#i-play"/></svg></div>
            <div class="just-changed" id="justChanged" hidden></div>
            <div class="scrim" id="histScrim" hidden><div class="scrim-chip"><strong id="histTitle"></strong><span id="histSub"></span></div></div>
            <div class="screen-msg" id="screenMsg" hidden></div>
            <div class="mon-bar" id="monBar" hidden></div>
          </div>
          <span class="mon-chip" id="monChip" hidden></span>
          <span class="stage-tag" id="workTag" hidden><svg><use href="#i-scan"/></svg><span id="workText"></span></span>
          <span class="source-tag" id="sourceTag" hidden></span>
          <button class="btn sm jump" id="jumpChange" type="button" hidden><svg><use href="#i-jump"/></svg><span id="jumpText"></span></button>
          <div class="work-bar" id="workBar" hidden><i></i></div>
        </div>
        <div class="transport" id="transport">
          <button class="t-btn" id="prevBeat" type="button"><svg><use href="#i-start"/></svg></button>
          <button class="play" id="playBtn" type="button" aria-pressed="false"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg><span class="spin" aria-hidden="true"></span></button>
          <button class="t-btn" id="nextBeat" type="button"><svg><use href="#i-end"/></svg></button>
          <button class="t-btn sm step-btn" id="backBtn" type="button"><svg><use href="#i-back"/></svg></button>
          <button class="t-btn sm step-btn" id="fwdBtn" type="button"><svg><use href="#i-fwd"/></svg></button>
          <div class="tc">
            <span class="tc-main"><span id="tc">0:00.00</span><span class="tc-total"> / <span id="tcTotal">0:00.00</span></span></span>
            <span class="tc-sub"><span id="tcFrame"></span><span class="tc-note" id="tcNote" role="status" aria-live="polite"></span></span>
          </div>
          <div class="bar" id="bar" role="slider" tabindex="0" aria-valuemin="0">
            <div class="bar-segs" id="barSegs"></div>
            <div id="barMarks"></div>
            <span class="knob" id="knob"></span>
            <span class="bar-hover" id="barHover" hidden></span>
          </div>
          <button class="t-btn mute" id="muteBtn" type="button" aria-pressed="false"><svg class="i-sound"><use href="#i-vol"/></svg><svg class="i-muted"><use href="#i-vol-x"/></svg></button>
          <span class="vol-wrap"><input class="range vol" id="volume" type="range" min="0" max="1" step="0.05" value="1"><span class="vol-val" id="volVal" hidden></span></span>
          <button class="t-btn" id="safeBtn" type="button" aria-pressed="false"><svg><use href="#i-safe"/></svg></button>
          <div class="which" role="group" id="which">
            <button type="button" id="srcLive" aria-pressed="true" data-i18n="tr.live">Current cut</button>
            <button type="button" id="srcDelivered" aria-pressed="false"><span data-i18n="tr.deliveredSwitch">Delivered film</span><span class="spin" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>

      <section class="beats" id="beats" aria-labelledby="beatsTitle">
        <div class="beats-head">
          <h3 id="beatsTitle" data-i18n="beats.title">Beats</h3>
          <span class="beats-sum" id="beatsSum"></span>
          <span class="grow"></span>
          <span class="health" id="health" tabindex="-1"></span>
          <button class="btn sm" id="tracksBtn" type="button" aria-expanded="false" aria-controls="timeline"><svg><use href="#i-rows"/></svg><span data-i18n="beats.tracks">Tracks</span></button>
        </div>
        <div class="error-banner" id="errorBanner" hidden role="alert">
          <strong data-i18n="err.title">The project file cannot be read</strong>
          <span class="error-text" id="errorText"></span>
          <span class="error-note" id="errorNote"></span>
        </div>
        <div class="beat-row" id="beatRow" role="listbox"></div>

        <section class="timeline" id="timeline" aria-label="Tracks" hidden>
          <div class="tl-bar">
            <div class="tl-tools">
              <button class="icon-btn sm" id="zoomOut" type="button"><svg><use href="#i-minus"/></svg></button>
              <span class="zoom-label" id="zoomLabel"></span>
              <button class="icon-btn sm" id="zoomIn" type="button"><svg><use href="#i-plus"/></svg></button>
              <button class="text-btn" id="zoomFit" type="button" aria-pressed="false"><svg><use href="#i-fit"/></svg><span data-i18n="tl.fit">Fit</span></button>
              <button class="text-btn toggle" id="followBtn" type="button" aria-pressed="true"><svg><use href="#i-follow"/></svg><span data-i18n="tl.follow">Follow</span></button>
            </div>
            <div class="summary" id="summary"></div>
            <div class="history-banner" id="historyBanner" hidden>
              <span class="hb-dot"></span>
              <span id="historyText"></span>
              <button class="text-btn accent" id="backToNow" type="button" data-i18n="tl.backToNow">Return to the current cut</button>
            </div>
          </div>
          <div class="tl-body">
            <div class="tl-heads" id="tlHeads"></div>
            <div class="tl-main" id="tlMain">
              <canvas id="tlCanvas" tabindex="0"></canvas>
              <div class="tl-empty" id="tlEmpty" hidden>
                <svg class="tl-empty-art" viewBox="0 0 120 56" aria-hidden="true">
                  <rect x="4" y="6" width="44" height="12" rx="3"/><rect x="52" y="6" width="28" height="12" rx="3"/>
                  <rect x="18" y="24" width="70" height="12" rx="3"/><rect x="4" y="42" width="112" height="10" rx="3"/>
                </svg>
                <strong id="tlEmptyTitle" data-i18n="tl.emptyTitle">No tracks yet</strong>
                <p id="tlEmptyBody" data-i18n="tl.emptyBody"></p>
              </div>
              <div class="tl-fade" id="tlFade" hidden></div>
              <div class="tl-vbar" id="tlVbar" hidden><div class="tl-vthumb" id="tlVthumb"></div></div>
              <div class="tl-tip" id="tlTip" hidden></div>
            </div>
          </div>
          <div class="tl-hbar" id="tlHbar"><div class="tl-hthumb" id="tlHthumb"></div></div>
        </section>
      </section>
    </section>
  </main>
</div>

<dialog class="help" id="help" aria-labelledby="helpTitle">
  <h2 id="helpTitle" data-i18n="help.title">About this window</h2>
  <p class="help-about" data-i18n="help.about"></p>
  <h3 data-i18n="help.keys">Keyboard</h3>
  <dl class="keys">
    <dt><kbd>Space</kbd></dt><dd data-i18n="help.play"></dd>
    <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="help.frame"></dd>
    <dt><kbd>Shift</kbd> <kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="help.second"></dd>
    <dt><kbd>Home</kbd> <kbd>End</kbd></dt><dd data-i18n="help.ends"></dd>
    <dt><kbd>PgUp</kbd> <kbd>PgDn</kbd></dt><dd data-i18n="help.beats"></dd>
    <dt><kbd>T</kbd></dt><dd data-i18n="help.tracks"></dd>
    <dt><kbd>+</kbd> <kbd>−</kbd> <kbd>F</kbd></dt><dd data-i18n="help.zoom"></dd>
    <dt><kbd>S</kbd></dt><dd data-i18n="help.safe"></dd>
    <dt><kbd>M</kbd></dt><dd data-i18n="help.mute"></dd>
    <dt><kbd>Esc</kbd></dt><dd data-i18n="help.esc"></dd>
    <dt><kbd>?</kbd></dt><dd data-i18n="help.help"></dd>
  </dl>
  <h3 data-i18n="help.marks">Marks</h3>
  <ul class="legend marks">
    <li><span class="sw mark-changed"></span><span data-i18n="help.markChanged"></span></li>
    <li><span class="sw mark-error"></span><span data-i18n="help.markError"></span></li>
    <li><span class="sw mark-missing"></span><span data-i18n="help.markMissing"></span></li>
  </ul>
  <h3 data-i18n="help.legend">Colours on the timeline</h3>
  <ul class="legend" id="legend"></ul>
  <div class="help-foot"><button class="btn primary" id="helpClose" type="button" data-i18n="help.close">Close</button></div>
</dialog>

<dialog class="lightbox" id="lightbox" aria-labelledby="lbTitle">
  <div class="lb-head">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-count num" id="lbCount"></span>
    <button class="icon-btn" id="lbClose" type="button"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="lb-stage">
    <button class="icon-btn lb-nav" id="lbPrev" type="button"><svg><use href="#i-back"/></svg></button>
    <figure class="lb-fig"><img id="lbImg" alt=""><figcaption class="lb-cap" id="lbCap"></figcaption></figure>
    <button class="icon-btn lb-nav" id="lbNext" type="button"><svg><use href="#i-fwd"/></svg></button>
  </div>
</dialog>
</body>
</html>
